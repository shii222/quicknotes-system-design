
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <main>
        <h1>QuickNotes</h1>
        <p>Manage your notes using an API.</p>

        <section>
            <h2>My Notes</h2>
            <button id="load-btn" type="button">Load notes</button>
            <p id="status" role="status" aria-live="polite"></p>
            <ul id="notes-list"></ul>
        </section>

        <section>
            <h2>Create a Note</h2>

            <form id="note-form">
                <label for="title-input">Title</label>
                <input
                    type="text"
                    id="title-input"
                    maxlength="100"
                    required
                >

                <label for="body-input">Body</label>
                <textarea id="body-input"></textarea>

                <button id="submit-btn" type="submit">
                    Create Note
                </button>
            </form>
        </section>
    </main>
</body>
</html>
